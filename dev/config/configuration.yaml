homeassistant:
  # The household instance. The calendar is its first tenant, not its purpose.
  name: Nolanhaus

default_config:

http:
  cors_allowed_origins:
    # Lets `npm run dev` (Vite on :5173) talk to this instance.
    - http://localhost:5173

# Mount point 1: the panel inside HA's frontend.
# `name` must equal the custom element tag registered in src/panel.ts.
panel_custom:
  - name: hacalendar-panel
    sidebar_title: Family Calendar
    sidebar_icon: mdi:calendar-heart
    url_path: family-calendar
    module_url: /local/hacalendar/panel.js
    require_admin: false
    config:
      entity_id: calendar.family

# The nightly chore materializer ([ADR-0008], Phase 4). Versioned in this repo
# rather than authored in HA's UI, because it is machinery: it derives every
# household detail from the label registry and never needs editing.
#
# Without this line HA still *accepts* automations over the config API and
# writes them to automations.yaml -- and then loads none of them, with no
# error anywhere. Verified 2026-09-04.
automation nightly_chores: !include_dir_merge_list automations/

# Backing up the config volume ([ADR-0023] -- HA Container has no snapshots).
# `shell_command` does not run a shell, so this calls one explicitly; the
# script is mounted read-only by docker-compose.yml. It returns its output in
# `stdout`, which the automation logs, so a silently-failing backup is visible.
shell_command:
  backup_config: /bin/sh /backup-config.sh

# local_calendar is config-flow only -- it cannot be set up from YAML.
# After first boot: Settings → Devices & Services → Add Integration →
# "Local Calendar", name it "Family". That yields calendar.family.
