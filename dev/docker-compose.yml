# This is HA *Container* -- no Supervisor, no add-on store. Per ADR-0023 the
# always-on laptop running this is BOTH dev and production; there is no separate
# HA OS box. Consequences: add-on-style software (e.g. Frigate) runs as its own
# container beside this one, and backups are manual -- schedule a copy of
# ./config, since local_calendar and every chore live in it.

# The HA instance is "nolanhaus" -- the household's smart home, of which this
# calendar is only the first tenant. Cameras and automation land here later.
# Without this, Compose would name the project after the directory ("dev").
name: nolanhaus

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: nolanhaus-ha-dev
    volumes:
      # `npm run watch` writes the bundle straight into config/www/hacalendar,
      # which HA serves at /local/hacalendar/.
      - ./config:/config
      # Nightly backups land here, OUTSIDE the volume being backed up. Point
      # this at another disk if the server has one -- as it stands it survives
      # a mistake or a corrupt config, not a dead drive. Relative on purpose:
      # Compose resolves it beside this file, so it needs no host path and
      # works the same on Windows, macOS and Linux.
      - ./backups:/backup
      - ./backup-config.sh:/backup-config.sh:ro
    ports:
      - "8123:8123"
    restart: unless-stopped
    environment:
      # Must match the household's real timezone. This is load-bearing: all-day
      # events arrive as bare `YYYY-MM-DD`, and any UTC-vs-local parsing bug
      # only manifests west of Greenwich. Central is UTC-5/-6.
      - TZ=America/Chicago
